services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: collog
      POSTGRES_USER: collog
      POSTGRES_PASSWORD: collog-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collog -d collog"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: collog-minio
      MINIO_ROOT_PASSWORD: collog-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set collog http://minio:9000 collog-minio collog-minio-secret;
        do sleep 1; done
        && mc mb --ignore-existing collog/collog-audio
        && mc anonymous set none collog/collog-audio

  livekit:
    image: livekit/livekit-server:v1.13.1
    command: ["--config", "/etc/livekit/livekit.yaml"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit/livekit.yaml:ro

  egress:
    image: livekit/egress:v1.12.0
    cap_add: ["SYS_ADMIN"]
    shm_size: "1gb"
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      EGRESS_CONFIG_FILE: /etc/livekit/egress.yaml
    volumes:
      - ./deploy/egress.yaml:/etc/livekit/egress.yaml:ro

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://collog:collog-local-only@postgres:5432/collog
      JWT_SECRET: ${JWT_SECRET:-collog-local-jwt-secret-change-before-production}
      MOCK_EXTERNAL_SERVICES: "false"
      TEAM_PORTAL_ENABLED: ${TEAM_PORTAL_ENABLED:-true}
      TEAM_PORTAL_REPOSITORY_URL: ${TEAM_PORTAL_REPOSITORY_URL:-https://github.com/Frekion2002/14th-hackathon}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: collog-dev-key
      LIVEKIT_API_SECRET: collog-dev-secret-change-before-production
      APNS_VOIP_ENABLED: ${APNS_VOIP_ENABLED:-false}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-sandbox}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRIVATE_KEY_PATH: ${APNS_PRIVATE_KEY_PATH:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_LANGUAGE: ko
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
      ACOUSTIC_ANALYZER_VERSION: ${ACOUSTIC_ANALYZER_VERSION:-collog-acoustic-v1}
      COUGH_SCORE_THRESHOLD: ${COUGH_SCORE_THRESHOLD:-0.65}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_BUCKET: collog-audio
      S3_ACCESS_KEY_ID: collog-minio
      S3_SECRET_ACCESS_KEY: collog-minio-secret
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
